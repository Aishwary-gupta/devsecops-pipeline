# ==============================================================================
# SonarQube Scanner Configuration
# Enforces Static Application Security Testing (SAST) & Quality Gates
# ==============================================================================

# Organization (Required when using SonarCloud; matches your SonarCloud organization key)
# sonar.organization=aishwary-gupta

sonar.projectKey=secure-devsecops-service
sonar.projectName=Secure DevSecOps Microservice
sonar.projectVersion=1.0.0

# Source & Test Code Structure
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Language Specification
sonar.language=js
sonar.sourceEncoding=UTF-8

# Code Coverage Integration (Generated by Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.js,node_modules/**

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,reports/**,k8s/**,policy/**

# Enforce Security & Quality Gate Blocking in Pipeline
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
