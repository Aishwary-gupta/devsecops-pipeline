apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-devsecops-service
  namespace: production
  labels:
    app.kubernetes.io/name: secure-devsecops-service
    app.kubernetes.io/instance: secure-service-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: devsecops-platform
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-devsecops-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-devsecops-service
    spec:
      # Pod-level security context enforcing non-root
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: ghcr.io/devsecops-org/secure-devsecops-service:1.0.0
          imagePullPolicy: IfNotPresent

          # Container-level hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # Resource limits to prevent resource exhaustion / DoS
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # Health check probes
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: tmp-volume
          emptyDir: {}
