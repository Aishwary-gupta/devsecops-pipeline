# ==============================================================================
# Trivy Secret Scanning Configuration
# Configures rule sets for scanning repositories, container layers, and configs
# ==============================================================================
rules:
  - id: slack-webhook-token
    category: Slack
    title: Slack Webhook Secret Detected
    severity: CRITICAL
    regex: 'https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8}/B[a-zA-Z0-9_]{8}/[a-zA-Z0-9_]{24}'
  - id: generic-private-key
    category: Crypto
    title: Unencrypted Private Key
    severity: CRITICAL
    regex: '-----BEGIN ((RSA|EC|DSA|OPENSSH) )?PRIVATE KEY-----'
